<!DOCTYPE html>
<html lang="ku" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorani Music STT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090b;
            /* Very dark background */
            --card-bg: rgba(255, 255, 255, 0.03);
            /* Glass card */
            --card-border: rgba(255, 255, 255, 0.08);
            --primary: #8b5cf6;
            /* Vibrant violet */
            --primary-hover: #a78bfa;
            --secondary: #3b82f6;
            /* Blue accent */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
            --warning-color: #fca5a5;
            --warning-bg: rgba(220, 38, 38, 0.15);
            --success: #34d399;
            --input-bg: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans Arabic', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.5;
        }

        .app-container {
            background-color: var(--card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 3rem;
            width: 100%;
            max-width: 650px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Subtle glowing top border effect on card */
        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0.5;
        }

        h2 {
            font-size: 2.25rem;
            margin-bottom: 0.25rem;
            font-weight: 700;
            background: linear-gradient(to right, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .warning-box {
            background-color: var(--warning-bg);
            color: var(--warning-color);
            padding: 1rem;
            border-radius: 12px;
            font-size: 0.9rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(248, 113, 113, 0.2);
            backdrop-filter: blur(10px);
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            padding: 2.5rem 1.5rem;
            border-radius: 16px;
            margin-bottom: 1.5rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: rgba(255, 255, 255, 0.02);
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--primary);
            background-color: rgba(139, 92, 246, 0.05);
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.1);
        }

        input[type="file"] {
            display: none;
        }

        .upload-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* Modern Inputs and Selects */
        input[type="text"],
        input[type="number"],
        select {
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
            background: rgba(0, 0, 0, 0.4);
        }

        select option {
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        .custom-file-upload {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            cursor: pointer;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            font-weight: 500;
            color: var(--text-main);
            transition: all 0.3s ease;
            margin-bottom: 0;
        }

        .custom-file-upload:hover {
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .file-name-display {
            font-size: 0.9rem;
            color: var(--primary-hover);
            margin-bottom: 15px;
            min-height: 20px;
            font-weight: 500;
        }

        /* Modern Checkboxes */
        .priority-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: var(--text-muted);
            font-size: 0.9rem;
            transition: color 0.3s ease;
            user-select: none;
        }

        .checkbox-wrapper:hover {
            color: var(--text-main);
        }

        .checkbox-wrapper input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--input-bg);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
        }

        .checkbox-wrapper input[type="checkbox"]:checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-wrapper input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            color: white;
            font-size: 14px;
            font-weight: bold;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Buttons */
        button {
            padding: 14px 28px;
            font-size: 1.05rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.5);
        }

        button:hover::before {
            left: 100%;
        }

        button:active {
            transform: translateY(1px);
        }

        button:disabled {
            background: var(--border-color);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            color: var(--text-muted);
        }

        button:disabled::before {
            display: none;
        }

        /* Secondary Button (Download) */
        #downloadBtn {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            margin-top: 20px;
        }

        #downloadBtn:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.5);
        }

        #status {
            margin: 1.5rem 0 1rem;
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-muted);
            min-height: 24px;
        }

        /* Frosted Output Box */
        #output {
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.25);
            text-align: right;
            line-height: 1.7;
            color: var(--text-main);
            font-size: 1.05rem;
            white-space: pre-wrap;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        /* Scrollbar styles for output */
        #output::-webkit-scrollbar {
            width: 8px;
        }

        #output::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
        }

        #output::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 8px;
        }

        #output::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .pulse {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: scale(0.98);
            }

            50% {
                opacity: 1;
                transform: scale(1.02);
                color: var(--primary-hover);
            }

            100% {
                opacity: 0.5;
                transform: scale(0.98);
            }
        }
    </style>
</head>

<body>
    <div class="app-container">

        <h2>سەوت بۆ دەق</h2>
        <p class="subtitle">Sorani Audio Transcription</p>

        <div class="warning-box">
            تێبینی: قەبارەی فایل نابێت لە ٤.٥ مێگابایت زیاتر بێت
            <br>
            <small style="opacity: 0.8; margin-top: 4px; display: inline-block;">(Maximum 4.5MB limit per
                upload)</small>
        </div>

        <div class="upload-area">
            <div class="upload-controls">
                <select id="languageSelect">
                    <option value="Kurdish" selected>کوردی (Keep Original Audio)</option>
                    <option value="Arabic">عربي (Translate to Arabic)</option>
                    <option value="English">English (Translate to English)</option>
                </select>

                <label for="fileInput" class="custom-file-upload">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    هەڵبژاردنی فایل (Choose File)
                </label>
                <input type="file" id="fileInput" accept="audio/*">

                <input type="number" id="blockDuration" placeholder="Seconds (e.g. 2)" min="1" max="10"
                    style="width: 150px;">

                <input type="text" id="keepNames" placeholder="Optional names to keep (auto-detected)"
                    style="width: 310px;">
            </div>

            <div class="priority-controls">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="priority1" checked>
                    Priority 1 (Single Line)
                </label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="priority2" checked>
                    Priority 2 (Duration)
                </label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="priority3" checked>
                    Priority 3 (Word Limit)
                </label>
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="priority4" checked>
                    Priority 4 (Natural Breaks)
                </label>
            </div>

            <div class="file-name-display" id="fileNameDisplay">هیچ فایلێک هەڵنەبژێردراوە</div>

            <button id="uploadBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                بارکردن و وەرگێڕان (Upload & Transcribe)
            </button>
        </div>

        <div id="status">ئامادەیە (Ready)</div>
        <div id="output">تێکستەکە لێرە دەردەکەوێت...</div>

        <button id="downloadBtn" style="display: none;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            دابەزاندنی فایل (Download SRT)
        </button>

    </div> <!-- This properly closes the app-container at the very end -->

    <script type="module">
        // Import Vercel Blob client via esm.sh CDN for vanilla HTML
        import { upload } from 'https://esm.sh/@vercel/blob/client';

        const blockDuration = document.getElementById('blockDuration');
        const languageSelect = document.getElementById('languageSelect');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const status = document.getElementById('status');
        const output = document.getElementById('output');
        const downloadBtn = document.getElementById('downloadBtn');
        const priority1 = document.getElementById('priority1');
        const priority2 = document.getElementById('priority2');
        const priority3 = document.getElementById('priority3');
        const priority4 = document.getElementById('priority4');
        const keepNames = document.getElementById('keepNames');

        // Update file name display when a file is selected
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                fileNameDisplay.textContent = e.target.files[0].name;
            } else {
                fileNameDisplay.textContent = "هیچ فایلێک هەڵنەبژێردراوە";
            }
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                return alert('Please select an audio file first.');
            }

            // Hide download button when starting a new upload
            downloadBtn.style.display = "none";

            status.textContent = "Uploading to cloud storage... This may take a minute.";
            status.classList.add('pulse');
            output.textContent = "";
            uploadBtn.disabled = true;
            uploadBtn.style.opacity = "0.7";

            try {
                // 1. Upload directly from the browser to Vercel Blob
                const blob = await upload(file.name, file, {
                    access: 'public',
                    handleUploadUrl: '/api/upload',
                });

                status.textContent = "Processing transcription with AI...";
                console.log("File is now safely in the cloud at:", blob.url);

                // 2. Send the new URL string to your transcription API logic
                const response = await fetch('/api/transcribe', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audioUrl: blob.url, // Sending URL instead of massive Base64
                        mimeType: file.type || 'audio/mp3',
                        filename: file.name,
                        duration: blockDuration.value || "1 to 2",
                        language: languageSelect.value,
                        keepNames: keepNames.value,
                        priorities: {
                            p1: priority1.checked,
                            p2: priority2.checked,
                            p3: priority3.checked,
                            p4: priority4.checked
                        }
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    output.textContent = data.text;
                    status.style.color = "var(--success)";
                    downloadBtn.style.display = "block"; // Show button on success
                } else {
                    output.textContent = "API Error: " + (data.error || "Unknown error");
                    status.style.color = "var(--warning-color)";
                }
            } catch (e) {
                console.error("Full error:", e);
                output.textContent = "Connection Error: " + e.message + " (Check F12 Developer Console)";
                status.style.color = "var(--warning-color)";
            } finally {
                status.textContent = "تەواو (Finished)";
                status.classList.remove('pulse');
                uploadBtn.disabled = false;
                uploadBtn.style.opacity = "1";

                // Reset status color after 3 seconds
                setTimeout(() => {
                    status.style.color = "var(--text-muted)";
                }, 3000);
            }
        });

        // Download SRT button click handler
        downloadBtn.addEventListener('click', () => {
            const textContent = output.textContent;
            if (!textContent) return;

            const blob = new Blob([textContent], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');

            const originalName = fileInput.files[0]?.name.split('.')[0] || 'transcription';
            a.href = url;
            a.download = `${originalName}.srt`;

            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });
    </script>
</body>

</html>
